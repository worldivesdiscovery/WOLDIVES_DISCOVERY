# nginx alternative (with certbot for HTTPS). /etc/nginx/sites-available/worldives
# In the server's .env: WOD_PUBLIC_URL=https://worldives.com and WOD_TRUSTED_PROXIES=127.0.0.1
server {
    listen 80;
    server_name worldives.com www.worldives.com;
    return 301 https://worldives.com$request_uri;
}
server {
    listen 443 ssl http2;
    server_name worldives.com;
    ssl_certificate     /etc/letsencrypt/live/worldives.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/worldives.com/privkey.pem;
    client_max_body_size 60m;

    # Map tiles: byte ranges, no buffering, no compression.
    location /tiles/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_buffering off;
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
        gzip off;
    }
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
