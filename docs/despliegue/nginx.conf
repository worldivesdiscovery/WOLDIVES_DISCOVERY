# nginx alternative (with certbot for HTTPS). /etc/nginx/sites-available/worldives
# In the server's .env: WOD_PUBLIC_URL=https://worldivesdiscovery.com and WOD_TRUSTED_PROXIES=127.0.0.1
# Certificate for the three names: certbot --nginx -d worldivesdiscovery.com -d www.worldivesdiscovery.com -d pruebas.worldivesdiscovery.com
# Access log without the query string (tokens, coordinates, searches) and with the address cut to /24 or /48.
map $remote_addr $wod_ip {
    ~(?P<a>\d+\.\d+\.\d+)\.\d+$          $a.0;
    ~^(?P<b>[0-9a-fA-F]*:[0-9a-fA-F]*:[0-9a-fA-F]*):  $b::;
    default                                     -;
}
log_format worldives '$wod_ip - [$time_iso8601] "$request_method $uri $server_protocol" $status $body_bytes_sent';

server {
    listen 80;
    server_name worldivesdiscovery.com www.worldivesdiscovery.com pruebas.worldivesdiscovery.com;
    access_log /var/log/nginx/worldives.log worldives;
    # The API never answers over http: a client with http:// gets an error instead of a silent redirect that would
    # have sent its key in clear (ASVS 5.0 V4.1.2).
    location /api/ { return 403; }
    location / {
        if ($host = pruebas.worldivesdiscovery.com) { return 301 https://pruebas.worldivesdiscovery.com$request_uri; }
        return 301 https://worldivesdiscovery.com$request_uri;
    }
}
# www → the root domain, also over https.
server {
    listen 443 ssl http2;
    server_name www.worldivesdiscovery.com;
    ssl_certificate     /etc/letsencrypt/live/worldivesdiscovery.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/worldivesdiscovery.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    return 301 https://worldivesdiscovery.com$request_uri;
}
server {
    listen 443 ssl http2;
    server_name worldivesdiscovery.com;
    ssl_certificate     /etc/letsencrypt/live/worldivesdiscovery.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/worldivesdiscovery.com/privkey.pem;
    # Mozilla «intermediate»: TLS 1.2 and 1.3, only AEAD suites with forward secrecy, the strongest first (ASVS V12.1.2).
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers on;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    access_log /var/log/nginx/worldives.log worldives;
    client_max_body_size 60m;

    # Map tiles: byte ranges, no buffering, no compression.
    location /tiles/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_buffering off;
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP "";
        gzip off;
    }
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP "";
        proxy_read_timeout 75s;     # above the longest wait of the application (a sign-in queues up to 60 s)
    }
}
# Test environment: the PRODUCTION package in /opt/worldives-pruebas (service worldives-pruebas, port 8001), its own
# database, .env and Stripe test keys, behind a password (htpasswd -B -c /etc/nginx/pruebas.htpasswd equipo).
server {
    listen 443 ssl http2;
    server_name pruebas.worldivesdiscovery.com;
    ssl_certificate     /etc/letsencrypt/live/worldivesdiscovery.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/worldivesdiscovery.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    access_log /var/log/nginx/pruebas.log worldives;
    client_max_body_size 60m;
    auth_basic "WORLDIVES pruebas";
    auth_basic_user_file /etc/nginx/pruebas.htpasswd;
    location / {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP "";
        proxy_set_header Authorization "";
        proxy_read_timeout 75s;
    }
}
